# Trung tâm Phẫu thuật Tạo hình Thẩm mỹ — BVĐK Hồng Phúc
# Chạy toàn bộ hệ thống (web + PostgreSQL) bằng 1 lệnh:
#   docker compose up --build
# Sau đó mở http://127.0.0.1:3000  (lần đầu hãy cấu hình BOOTSTRAP_ADMIN_* trong .env)
#
# 🔐 BẢO MẬT: AUTH_SECRET được tạo NGẪU NHIÊN tự động và lưu trong volume an toàn
#    (không nằm trong mã nguồn). Muốn tự đặt khoá riêng, tạo file .env cạnh file này
#    (xem .env.example). Đổi PHONE_ENC_KEY cần mã hoá lại dữ liệu SĐT — xem web/DEPLOY.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-zenith}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-zenith_dev_pw}"
      POSTGRES_DB: "${POSTGRES_DB:-zenith_clinic}"
    volumes:
      - zenith_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenith} -d ${POSTGRES_DB:-zenith_clinic}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./web
      args:
        BUILD_COMMIT: "${ZENITH_BUILD_COMMIT:-unknown}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://zenith:zenith_dev_pw@db:5432/zenith_clinic?schema=public}"
      # Để trống = container tự sinh/đọc khoá trong volume (an toàn, không lộ trong Git).
      # Muốn tự đặt: khai báo trong file .env cạnh docker-compose.yml.
      AUTH_SECRET: "${AUTH_SECRET:-}"
      PHONE_ENC_KEY: "${PHONE_ENC_KEY:-}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/app/private/uploads}"
      ALLOW_DEMO_SEED: "${ALLOW_DEMO_SEED:-false}"
      # Chỉ dùng khi ALLOW_DEMO_SEED=true trong QA cô lập; không dùng production.
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      TRUSTED_PROXY: "${TRUSTED_PROXY:-false}"
      APP_NAME: "${APP_NAME:-Trung tâm Phẫu thuật Tạo hình Thẩm mỹ — BVĐK Hồng Phúc}"
      TZ: "Asia/Ho_Chi_Minh"
      # Khi chạy qua tên miền/Cloudflare Tunnel, điền tên miền vào đây (ngăn cách bằng dấu phẩy)
      # để đảm bảo các thao tác lưu/xóa hoạt động sau proxy.
      APP_ORIGINS: "${APP_ORIGINS:-trungtamphauthuattaohinhvathammybenhviendakhoahongphuc.xyz,www.trungtamphauthuattaohinhvathammybenhviendakhoahongphuc.xyz}"
      # AI soạn tin chăm sóc — TRUNG LẬP NHÀ CUNG CẤP (DeepSeek/Qwen/Gemini/OpenAI/Claude/tự host).
      # Điền AI_API_KEY + AI_BASE_URL + AI_MODEL trong .env; có thể thêm AI_AGENT_MODEL cho planner reasoning (xem .env.example).
      # Để trống = tính năng AI tự ẩn.
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_AGENT_MODEL: "${AI_AGENT_MODEL:-}"
      AI_WRITER_MODEL: "${AI_WRITER_MODEL:-}"
      AI_TIMEOUT_MS: "${AI_TIMEOUT_MS:-30000}"
      AI_MAX_RETRIES: "${AI_MAX_RETRIES:-2}"
      AI_PROVIDER: "${AI_PROVIDER:-}"
      # Feature flags mặc định tắt; chỉ bật sau review + migration + smoke test.
      ENABLE_ZENITH_V2: "${ENABLE_ZENITH_V2:-false}"
      ENABLE_AI_TRAINING_STUDIO: "${ENABLE_AI_TRAINING_STUDIO:-false}"
      UX_ROLLOUT: "${UX_ROLLOUT:-all}"
      # Nhận dạng giọng nói tuỳ chọn.
      VOICE_PROVIDER: "${VOICE_PROVIDER:-}"
      VOICE_API_KEY: "${VOICE_API_KEY:-}"
      VOICE_BASE_URL: "${VOICE_BASE_URL:-}"
      VOICE_MODEL: "${VOICE_MODEL:-}"
      # Tương thích ngược cách cũ (chỉ Claude):
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      # Kênh giao tiếp: Zalo OA + Facebook Messenger — TUỲ CHỌN, để trống thì trang
      # /cham-soc/hop-thu vẫn chạy nhưng không nhận/gửi tin thật. Xem khối "Kênh giao
      # tiếp" trong .env.example — hướng dẫn lấy từng giá trị có ngay trong app tại
      # /cham-soc/ket-noi (đăng nhập ADMIN).
      ZALO_APP_ID: "${ZALO_APP_ID:-}"
      ZALO_APP_SECRET: "${ZALO_APP_SECRET:-}"
      ZALO_OA_SECRET_KEY: "${ZALO_OA_SECRET_KEY:-}"
      FB_APP_SECRET: "${FB_APP_SECRET:-}"
      FB_VERIFY_TOKEN: "${FB_VERIFY_TOKEN:-}"
      FB_APP_ID: "${FB_APP_ID:-}"
      FB_GRAPH_API_VERSION: "${FB_GRAPH_API_VERSION:-}"
      PUSH_VAPID_PUBLIC_KEY: "${PUSH_VAPID_PUBLIC_KEY:-}"
      PUSH_VAPID_PRIVATE_KEY: "${PUSH_VAPID_PRIVATE_KEY:-}"
      PUSH_VAPID_SUBJECT: "${PUSH_VAPID_SUBJECT:-}"
    ports:
      - "3000:3000"
    volumes:
      - zenith_uploads:/app/private/uploads
      - zenith_secrets:/app/.runtime

volumes:
  zenith_db:
  zenith_uploads:
  zenith_secrets:
