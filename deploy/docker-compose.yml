# Triển khai trên MÁY CHỦ ĐÁM MÂY (VPS Linux) + tên miền + HTTPS tự động.
# Khác bản gốc (cho Windows): có thêm Caddy lo HTTPS, app không mở cổng ra ngoài.
#
# Cách dùng nhanh:  cd deploy && docker compose up -d --build
# Hoặc chạy script:  bash deploy/cai-dat-vps.sh   (xem deploy/HUONG-DAN-VPS.md)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-zenith}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-zenith_dev_pw}"
      POSTGRES_DB: "${POSTGRES_DB:-zenith_clinic}"
    volumes:
      - zenith_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenith} -d ${POSTGRES_DB:-zenith_clinic}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: ../web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://zenith:zenith_dev_pw@db:5432/zenith_clinic?schema=public}"
      # Để trống = container tự sinh/đọc khoá an toàn trong volume (không lộ trong Git).
      AUTH_SECRET: "${AUTH_SECRET:-}"
      PHONE_ENC_KEY: "${PHONE_ENC_KEY:-}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/app/private/uploads}"
      ALLOW_DEMO_SEED: "${ALLOW_DEMO_SEED:-false}"
      # Chỉ dùng khi ALLOW_DEMO_SEED=true trong QA cô lập; không dùng production.
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      TRUSTED_PROXY: "${TRUSTED_PROXY:-false}"
      APP_NAME: "Trung tâm Phẫu thuật Tạo hình Thẩm mỹ — BVĐK Hồng Phúc"
      TZ: "Asia/Ho_Chi_Minh"
      APP_ORIGINS: "${APP_ORIGINS:-trungtamphauthuattaohinhvathammybenhviendakhoahongphuc.xyz,www.trungtamphauthuattaohinhvathammybenhviendakhoahongphuc.xyz}"
      # AI soạn tin — trung lập nhà cung cấp (xem khối "AI" trong web/.env.example).
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_AGENT_MODEL: "${AI_AGENT_MODEL:-}"
      AI_WRITER_MODEL: "${AI_WRITER_MODEL:-}"
      AI_TIMEOUT_MS: "${AI_TIMEOUT_MS:-30000}"
      AI_MAX_RETRIES: "${AI_MAX_RETRIES:-2}"
      AI_PROVIDER: "${AI_PROVIDER:-}"
      VOICE_API_KEY: "${VOICE_API_KEY:-}"
      VOICE_BASE_URL: "${VOICE_BASE_URL:-https://api.openai.com/v1}"
      VOICE_MODEL: "${VOICE_MODEL:-whisper-1}"
      # Tương thích ngược cách cũ (chỉ Claude):
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      # Kênh giao tiếp: Zalo OA + Facebook Messenger — tuỳ chọn (xem khối "Kênh giao
      # tiếp" trong web/.env.example; hướng dẫn lấy giá trị có ngay trong app tại
      # /cham-soc/ket-noi).
      ZALO_APP_ID: "${ZALO_APP_ID:-}"
      ZALO_APP_SECRET: "${ZALO_APP_SECRET:-}"
      ZALO_OA_SECRET_KEY: "${ZALO_OA_SECRET_KEY:-}"
      FB_APP_SECRET: "${FB_APP_SECRET:-}"
      FB_VERIFY_TOKEN: "${FB_VERIFY_TOKEN:-}"
      FB_APP_ID: "${FB_APP_ID:-}"
      FB_GRAPH_API_VERSION: "${FB_GRAPH_API_VERSION:-}"
      PUSH_VAPID_PUBLIC_KEY: "${PUSH_VAPID_PUBLIC_KEY:-}"
      PUSH_VAPID_PRIVATE_KEY: "${PUSH_VAPID_PRIVATE_KEY:-}"
      PUSH_VAPID_SUBJECT: "${PUSH_VAPID_SUBJECT:-}"
    volumes:
      - zenith_uploads:/app/private/uploads
      - zenith_secrets:/app/.runtime

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  zenith_db:
  zenith_uploads:
  zenith_secrets:
  caddy_data:
  caddy_config:
